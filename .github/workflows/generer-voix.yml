name: Générer les voix

# Lancement manuel : onglet Actions → « Générer les voix » → Run workflow
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Épisodes : all, ou des ids séparés par des virgules (ex. regime-mere-fille)"
        required: true
        default: "regime-mere-fille"
      force:
        description: "Régénérer même si le MP3 existe déjà"
        type: boolean
        default: false
      sans_credit:
        description: "N'utiliser que l'historique ElevenLabs (aucun crédit dépensé)"
        type: boolean
        default: false
      nombres:
        description: "Nombres en toutes lettres : all, ou des ids (vide = seulement les numéros de compte)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generer-voix
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Générer les MP3 avec ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_COURS: ${{ vars.VOICE_COURS }}
          VOICE_NARRATRICE: ${{ vars.VOICE_NARRATRICE }}
          VOICE_DIRIGEANT: ${{ vars.VOICE_DIRIGEANT }}
          VOICE_EXPERT: ${{ vars.VOICE_EXPERT }}
          EPISODES: ${{ inputs.episodes }}
          FORCE: ${{ inputs.force }}
          SANS_CREDIT: ${{ inputs.sans_credit }}
          NOMBRES: ${{ inputs.nombres }}
        run: npx --yes tsx@4.19.2 scripts/generer-voix.ts

      # Copie de secours : les MP3 restent téléchargeables 30 jours même si l'enregistrement échoue
      - name: Copie de secours des MP3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voix-${{ github.run_id }}
          path: |
            public/audio/*.mp3
            src/content/audio.ts
          retention-days: 30

      - name: Enregistrer les MP3 dans le dépôt
        if: always()
        run: |
          git config user.name "Zenvise (voix)"
          git config user.email "actions@users.noreply.github.com"
          git add public/audio src/content/audio.ts
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Voix studio : ${{ inputs.episodes }}"
            # D'autres modifications ont pu arriver sur main pendant la génération : on se remet à jour avant d'envoyer
            for essai in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep $((essai * 5))
            done
            exit 1
          fi
