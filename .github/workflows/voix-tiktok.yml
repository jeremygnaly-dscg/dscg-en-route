name: Voix des vidéos TikTok

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Vidéos : all, ou des ids séparés par des virgules (voir media/tiktok/videos.json)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: generer-voix
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Générer les voix
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_EXPERT: ${{ vars.VOICE_EXPERT }}
          VIDEOS: ${{ inputs.videos }}
        run: npx --yes tsx@4.19.2 scripts/voix-tiktok.ts
      - name: Enregistrer les MP3
        run: |
          git config user.name "Zenvise (voix)"
          git config user.email "actions@users.noreply.github.com"
          git add media/tiktok
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Voix TikTok : ${{ inputs.videos }}"
          for essai in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((essai * 5))
          done
          exit 1
